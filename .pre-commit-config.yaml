# Install once: pre-commit install
# Run everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint
        additional_dependencies: ["dbt-core==1.11.16", "dbt-snowflake==1.11.6", "sqlfluff-templater-dbt==4.4.0"]
      - id: sqlfluff-fix
        stages: [manual]
        additional_dependencies: ["dbt-core==1.11.16", "dbt-snowflake==1.11.6", "sqlfluff-templater-dbt==4.4.0"]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/.tflint.hcl]

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.29
    hooks:
      - id: checkov
        args: [--framework, terraform, --quiet, --compact]
        files: ^terraform/
